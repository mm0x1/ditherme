<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dithertoy API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
        }
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
        }
        .swagger-ui {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Dark theme overrides */
        .swagger-ui .topbar {
            background-color: #2d2d2d;
        }
        .swagger-ui .info .title {
            color: #fff;
        }
        .swagger-ui .info .description p {
            color: #ccc;
        }
        .swagger-ui .opblock-tag {
            color: #fff;
            border-color: #3d3d3d;
        }
        .swagger-ui .opblock {
            background: #2d2d2d;
            border-color: #3d3d3d;
        }
        .swagger-ui .opblock .opblock-summary-method {
            font-weight: bold;
        }
        .swagger-ui .opblock .opblock-summary-path {
            color: #fff;
        }
        .swagger-ui .opblock .opblock-summary-description {
            color: #ccc;
        }
        .swagger-ui .opblock-description-wrapper p {
            color: #ccc;
        }
        .swagger-ui table thead tr th {
            color: #fff;
        }
        .swagger-ui table tbody tr td {
            color: #ccc;
        }
        .swagger-ui .model-title {
            color: #fff;
        }
        .swagger-ui .model {
            color: #ccc;
        }
        .swagger-ui .parameter__name {
            color: #fff;
        }
        .swagger-ui .parameter__type {
            color: #61affe;
        }
        /* Connection status banner */
        .connection-status {
            padding: 10px 20px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .connection-status.connected {
            background: #2ecc71;
            color: #fff;
        }
        .connection-status.disconnected {
            background: #e74c3c;
            color: #fff;
        }
        .connection-status.checking {
            background: #f39c12;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="connection-status" class="connection-status checking">
        Checking API connection...
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        // Get API port from URL params or default
        const urlParams = new URLSearchParams(window.location.search);
        const apiPort = urlParams.get('port') || '7842';
        const apiUrl = `http://localhost:${apiPort}`;

        // Check API connection
        const statusEl = document.getElementById('connection-status');

        async function checkConnection() {
            try {
                const response = await fetch(`${apiUrl}/api/info`);
                if (response.ok) {
                    const data = await response.json();
                    statusEl.className = 'connection-status connected';
                    statusEl.textContent = `Connected to dithertoy API v${data.apiVersion} at ${apiUrl}`;
                    return data;
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                statusEl.className = 'connection-status disconnected';
                statusEl.textContent = `Cannot connect to API at ${apiUrl}. Make sure dithertoy is running.`;
                return null;
            }
        }

        // OpenAPI spec definition (embedded)
        const openApiSpec = {
            openapi: '3.0.3',
            info: {
                title: 'dithertoy API',
                description: 'HTTP-based REST API for programmatically controlling dithertoy.',
                version: '1.0.0'
            },
            servers: [{ url: apiUrl, description: 'Local API server' }],
            tags: [
                { name: 'Discovery', description: 'API discovery and status' },
                { name: 'Settings', description: 'Dithering configuration' },
                { name: 'Image', description: 'Image loading and processing' },
                { name: 'Palettes', description: 'Palette management' },
                { name: 'Batch', description: 'Batch processing' }
            ],
            paths: {
                '/api/info': {
                    get: {
                        tags: ['Discovery'],
                        summary: 'API Discovery',
                        description: 'Returns API metadata including version, capabilities, and available endpoints.',
                        responses: { '200': { description: 'API information' } }
                    }
                },
                '/api/status': {
                    get: {
                        tags: ['Discovery'],
                        summary: 'Application Status',
                        description: 'Returns current application status.',
                        responses: { '200': { description: 'Application status' } }
                    }
                },
                '/api/algorithms': {
                    get: {
                        tags: ['Settings'],
                        summary: 'List Algorithms',
                        description: 'Returns all available dithering algorithms.',
                        responses: { '200': { description: 'Algorithm list' } }
                    }
                },
                '/api/settings': {
                    get: {
                        tags: ['Settings'],
                        summary: 'Get Settings',
                        description: 'Returns current dithering settings.',
                        responses: { '200': { description: 'Current settings' } }
                    },
                    post: {
                        tags: ['Settings'],
                        summary: 'Update Settings',
                        description: 'Updates dithering settings.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    example: {
                                        algorithm: 'floyd-steinberg',
                                        palette: 'gameboy',
                                        pixelScale: 2
                                    }
                                }
                            }
                        },
                        responses: { '200': { description: 'Settings updated' } }
                    }
                },
                '/api/load': {
                    post: {
                        tags: ['Image'],
                        summary: 'Load Image',
                        description: 'Loads an image from base64, URL, or file path.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    examples: {
                                        base64: {
                                            summary: 'Load from base64',
                                            value: {
                                                source: {
                                                    type: 'base64',
                                                    data: '<base64-encoded-image>',
                                                    mimeType: 'image/png'
                                                }
                                            }
                                        },
                                        url: {
                                            summary: 'Load from URL',
                                            value: {
                                                source: {
                                                    type: 'url',
                                                    url: 'https://example.com/image.png'
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        },
                        responses: { '200': { description: 'Image loaded' } }
                    }
                },
                '/api/dither': {
                    post: {
                        tags: ['Image'],
                        summary: 'Trigger Dithering',
                        description: 'Triggers dithering with current or overridden settings.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    example: {
                                        settings: {
                                            algorithm: 'atkinson'
                                        }
                                    }
                                }
                            }
                        },
                        responses: { '200': { description: 'Dithering complete' } }
                    }
                },
                '/api/result': {
                    get: {
                        tags: ['Image'],
                        summary: 'Get Result',
                        description: 'Returns the dithered result image.',
                        parameters: [
                            { name: 'format', in: 'query', schema: { type: 'string', enum: ['png', 'jpeg', 'webp'] } },
                            { name: 'quality', in: 'query', schema: { type: 'integer', minimum: 1, maximum: 100 } },
                            { name: 'scale', in: 'query', schema: { type: 'number' } },
                            { name: 'encoding', in: 'query', schema: { type: 'string', enum: ['base64', 'binary'] } }
                        ],
                        responses: { '200': { description: 'Result image' } }
                    }
                },
                '/api/export': {
                    post: {
                        tags: ['Image'],
                        summary: 'Export Image',
                        description: 'Exports the dithered image with specified format.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    example: {
                                        format: 'png',
                                        scale: 2
                                    }
                                }
                            }
                        },
                        responses: { '200': { description: 'Exported image' } }
                    }
                },
                '/api/palettes': {
                    get: {
                        tags: ['Palettes'],
                        summary: 'List Palettes',
                        description: 'Returns all available palettes.',
                        responses: { '200': { description: 'Palette list' } }
                    }
                },
                '/api/palette': {
                    post: {
                        tags: ['Palettes'],
                        summary: 'Set Palette',
                        description: 'Sets the current palette.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    examples: {
                                        preset: {
                                            summary: 'Use preset',
                                            value: { preset: 'gameboy' }
                                        },
                                        custom: {
                                            summary: 'Custom colors',
                                            value: {
                                                name: 'My Palette',
                                                colors: [
                                                    { r: 0, g: 0, b: 0 },
                                                    { r: 255, g: 255, b: 255 }
                                                ]
                                            }
                                        }
                                    }
                                }
                            }
                        },
                        responses: { '200': { description: 'Palette set' } }
                    }
                },
                '/api/batch': {
                    post: {
                        tags: ['Batch'],
                        summary: 'Create Batch Job',
                        description: 'Creates a new batch processing job.',
                        requestBody: {
                            content: {
                                'application/json': {
                                    schema: { type: 'object' },
                                    example: {
                                        items: [
                                            { source: { type: 'url', url: 'https://example.com/1.png' } },
                                            { source: { type: 'url', url: 'https://example.com/2.png' } }
                                        ],
                                        settings: {
                                            algorithm: 'floyd-steinberg',
                                            export: { format: 'png' }
                                        },
                                        autoStart: true
                                    }
                                }
                            }
                        },
                        responses: { '201': { description: 'Job created' } }
                    }
                },
                '/api/batch/{id}': {
                    get: {
                        tags: ['Batch'],
                        summary: 'Get Batch Job',
                        description: 'Returns batch job status and results.',
                        parameters: [
                            { name: 'id', in: 'path', required: true, schema: { type: 'string' } }
                        ],
                        responses: { '200': { description: 'Job status' } }
                    }
                }
            }
        };

        // Initialize Swagger UI
        async function initSwaggerUI() {
            await checkConnection();

            window.ui = SwaggerUIBundle({
                spec: openApiSpec,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: 'StandaloneLayout',
                tryItOutEnabled: true,
                supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch']
            });
        }

        initSwaggerUI();

        // Periodically check connection
        setInterval(checkConnection, 10000);
    </script>
</body>
</html>
